<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio widget, single card</title>
<!-- One prototype card and nothing else, so it can be dropped into a real
     embed slot on a host page and judged at the size that slot gives it.
     The card itself is the same code the prototype page runs, loaded from the
     same two files, so the two can never drift apart. -->
<link rel="stylesheet" href="widget-core.css?v=20260921213559">
<style>
  /* An embed fills the frame it is given. No page gutters, no max width, no
     chrome: whatever the host sized the iframe to is the whole budget. */
  html, body { margin: 0; padding: 0; background: transparent; }
  body { display: block; }
  /* The frame's height IS the card's budget, so the shell takes all of it and
     the card compresses into it. Without this the card drew its own default
     height inside the frame and a short slot simply clipped it, which is what
     host-home.html's 150 was doing: the compression rules had nothing to
     measure against because the shell had no definite height. */
  html, body, .shell { height: 100%; }
  .shell { width: 100%; max-width: none; }
  /* The status line and the colour readout belong to the prototype page's
     instrumentation, not to an embed. They stay in the DOM because the widget
     code writes to them, and they are simply not shown. */
  .status, .colourline { display: none; }
</style>
</head>
<body>
<div class="shell" id="slot" data-fill></div>

<script>
/* Which card to build, read from the query string. The root id is what the
   shared widget code keys off, so the id decides the design and the content
   type together, exactly as it does on the prototype page. */
const ROOTS = {
  'a-podcast': 'w-podcast',      'a-live': 'w-live',
  'b-podcast': 'w-podcast-hero', 'b-live': 'w-live-hero',
  'c-podcast': 'w-podcast-c',    'c-live': 'w-live-c'
};
const q = new URLSearchParams(location.search);
const design = (q.get('design') || 'a').toLowerCase();
const mode = (q.get('mode') || 'podcast').toLowerCase();
const key = design + '-' + mode;
const root = ROOTS[key] || ROOTS['a-podcast'];
const id = root.replace(/^w-/, '');
/* Written before the widget script runs, because that script builds whatever
   roots it finds at load. */
document.getElementById('slot').innerHTML =
  `<div id="${root}"></div><p class="status" id="s-${id}"></p>` +
  `<div class="colourline" id="c-${id}"></div>`;
document.title = 'Audio widget, design ' + design.toUpperCase() + ', ' + mode;
/* The waveform is OFF here by default, which is what the prototype page opens
   with and therefore what a host page dropping this into a slot should get.
   ?wave=on brings it back for anyone who wants to look at it. */
document.body.dataset.wave = (q.get('wave') || '').toLowerCase() === 'on' ? 'on' : 'off';
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script src="widget-core.js?v=20260921213559"></script>
<script>
/* An embed cannot resize the box it is given, so it reports what it needs and
   leaves the decision to the host. This is the same shape as the usual embed
   resize convention: a message that names itself, carrying a height in CSS
   pixels. A host that ignores it is no worse off than it is today.

   The target origin is left open because the host is whatever page embedded
   this one, which is not knowable from in here. That is safe in this direction:
   the message carries a height and the card's identity, nothing private. */
(function reportHeight() {
  if (window.parent === window) return;             /* opened directly, no host */
  let last = 0;
  const send = () => {
    const card = document.querySelector('.widget');
    /* The card's own height, not the document's, so page padding cannot creep
       into the number. scrollHeight is the fallback before the card exists. */
    const h = Math.ceil(card ? card.getBoundingClientRect().height
                             : document.documentElement.scrollHeight);
    if (!h || h === last) return;
    last = h;
    parent.postMessage({ type: 'widget-height', design: design, mode: mode, height: h }, '*');
  };
  /* The height moves for real reasons after load: artwork arrives, the episode
     list fills in, playing reveals a control row, a drawer opens. Watching the
     card itself covers all of them. */
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(send);
    const watch = () => {
      const card = document.querySelector('.widget');
      if (card) { ro.observe(card); send(); return true; }
      return false;
    };
    /* The card is built from an API response, so it is not there at load. */
    if (!watch()) {
      const mo = new MutationObserver(() => { if (watch()) mo.disconnect(); });
      mo.observe(document.body, { childList: true, subtree: true });
    }
  }
  /* Belt and braces for anything an observer misses, such as a web font
     landing late, and for browsers without a ResizeObserver at all. */
  addEventListener('load', send);
  [100, 400, 1200, 3000].forEach((t) => setTimeout(send, t));
})();
</script>
</body>
</html>
