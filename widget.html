<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Widget Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="widget-core.css?v=20260921220207">
</head>
<body data-bg="grey">

<header>
  <div class="brand">Widget Prototype</div>
  <!-- The same cards in a real page's rail, for judging them in context rather
       than on a blank background. New tab, so playback and the width setting
       here survive the trip. -->
  <div class="hint"><a href="host-home.html" target="_blank" rel="noopener">See it in a publisher page</a></div>
  <div class="hint">Window <b class="vw" id="vw">0</b> px</div>
  <div class="widthctl">
    <label for="widthRange">Player width</label>
    <input id="widthRange" type="range" min="50" max="1320" step="1" aria-label="Player width">
    <input id="widthNum" type="number" min="50" max="1320" step="1" aria-label="Player width in pixels">
    <span class="unit">px</span>
    <button type="button" id="widthFill">Fill</button>
  </div>
  <!-- Height. A slot hands a card a height as surely as it hands it a width,
       and until this control existed the page could only ask half the question.
       Auto is the default and means no height is set at all, so the page loads
       exactly as it did, which is what keeps this additive.
       100, down from 150. 150 was chosen because it is the height the iHeart
       homepage hardcodes for this slot, and design C could not fit it anyway.
       It fits now, so the floor moves below it: the useful range is the one
       where the card visibly gives up, and design C stops compressing at 136. -->
  <div class="widthctl heightctl">
    <label for="heightRange">Player height</label>
    <input id="heightRange" type="range" min="100" max="900" step="1" value="440"
           aria-label="Player height">
    <input id="heightNum" type="number" min="100" max="900" step="1"
           aria-label="Player height in pixels">
    <span class="unit">px</span>
    <button type="button" id="heightAuto" aria-pressed="true">Auto</button>
  </div>
  <!-- The waveform and background switches are hidden for now. Their DEFAULTS
       are still in force and are the only thing that was ever shipping here:
       data-wave="off" on <main> below and data-bg="grey" on <body>. Putting
       these two blocks back, along with their listeners in the script at the
       foot of this file, is all it takes to bring the controls back.
  <div class="colctl">
    <label for="wavetog">Waveform</label>
    <span class="seg">
      <button type="button" id="wavetog" data-wave="on" aria-pressed="false">On</button>
      <button type="button" data-wave="off" aria-pressed="true">Off</button>
    </span>
  </div>
  <div class="colctl">
    <label for="bggrey">Background</label>
    <span class="seg">
      <button type="button" id="bggrey" data-bg="grey" aria-pressed="true">Grey</button>
      <button type="button" data-bg="white" aria-pressed="false">White</button>
    </span>
  </div>
  -->
  <!-- The pause overlay. Off by default, because it covers the card the moment
       you pause and the cards are what this page exists to look at. It is still
       worth being able to see, so it is a switch rather than a deletion. -->
  <div class="colctl">
    <label for="veiltog">Pause overlay</label>
    <span class="seg">
      <button type="button" id="veiltog" data-veil="on" aria-pressed="false">On</button>
      <button type="button" data-veil="off" aria-pressed="true">Off</button>
    </span>
  </div>
  <div class="colctl">
    <label for="cols1">Columns</label>
    <span class="seg">
      <button type="button" id="cols1" data-cols="1" aria-pressed="false">1</button>
      <button type="button" id="cols2" data-cols="2" aria-pressed="true">2</button>
    </span>
  </div>
</header>

<main data-cols="2" data-wave="off">
  <!-- One search per content type, for the whole page. Choosing a show or a
       station already loads it into every card of that kind, so a box per
       section was four controls doing one job. -->
  <div class="searchrow">
    <div class="search" data-for="podcast">
      <input type="search" placeholder="Search podcasts, try Las Culturistas or Stuff You Should Know" aria-label="Search podcasts">
      <div class="results" hidden></div>
    </div>
    <div class="search" data-for="live">
      <input type="search" placeholder="Search stations, try Z100 or KFI" aria-label="Search stations">
      <div class="results" hidden></div>
    </div>
  </div>
  <!-- The shipping player is split into a band and two sections, one per content
       type, so it has the same shape as a design block and can take a column of
       its own beside them. -->
  <div class="band band-ship" data-design="ship">
    <h2>What ships today</h2>
  </div>

  <section data-design="ship" data-kind="podcast">
    <div class="h2row"><h2>Podcast</h2></div>
    <div class="embed">
      <iframe id="e-podcast" title="iHeart podcast embed, current production player"
              allow="autoplay" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <p class="status" id="s-embeds"></p>
  </section>

  <section data-design="ship" data-kind="live">
    <div class="h2row"><h2>Live radio</h2></div>
    <div class="embed">
      <iframe id="e-live" title="iHeart live radio embed, current production player"
              allow="autoplay" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </section>

  <!-- Podcast, then live, THEN the three that have no design counterpart. The
       order is not grouping podcast with its episode, on purpose: the multi
       column layouts put podcast beside podcast and live beside live, so those
       two have to stay in the first two rows, and having the page read in a
       different order at one width than at another is worse than splitting the
       two podcast frames apart. -->

  <section data-design="ship" data-kind="episode">
    <div class="h2row"><h2>Podcast episode</h2></div>
    <div class="embed">
      <iframe id="e-episode" title="iHeart podcast episode embed, current production player"
              allow="autoplay" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </section>

  <!-- Artist radio and playlist have no search box, so these two are fixed
       examples. Their src is set in widget-core.js beside the others rather
       than hardcoded here, so every embed URL on the page lives in one place. -->
  <section data-design="ship" data-kind="artist">
    <div class="h2row"><h2>Artist radio</h2></div>
    <div class="embed">
      <iframe id="e-artist" title="iHeart artist radio embed, current production player"
              allow="autoplay" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </section>

  <section data-design="ship" data-kind="playlist">
    <div class="h2row"><h2>Playlist</h2></div>
    <div class="embed">
      <iframe id="e-playlist" title="iHeart playlist embed, current production player"
              allow="autoplay" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </section>

  <!-- Design A is hidden for now. Commented out rather than deleted, for the
       same reason design B was: the roster in widget-core.js builds itself from
       whichever roots exist in the page, so with w-podcast and w-live gone no
       bar widget is created, nothing is loaded for it and no audio element is
       made. Put the block back to bring it back. -->
  <!--
  <div class="band band-proto" data-design="a">
    <h2>Design A</h2>
  </div>

  <section data-design="a" data-kind="podcast">
    <div class="h2row"><h2>Podcast</h2></div>
    <div class="shell"><div id="w-podcast"></div></div>
    <p class="status" id="s-podcast"></p>
  </section>

  <section data-design="a" data-kind="live">
    <div class="h2row"><h2>Live radio</h2></div>
    <div class="shell"><div id="w-live"></div></div>
    <p class="status" id="s-live"></p>
  </section>

  -->

  <!-- Design B is hidden for now, the same way design A is. Commented out
       rather than deleted, because the roster in widget-core.js builds itself
       from whichever roots exist in the page: with w-podcast-hero and
       w-live-hero gone no hero widget is created, nothing is fetched for it and
       no audio element is made. Put the block back to bring it back.
       The page is now what ships against design C, two sets rather than three,
       which is why the three column option went with it. -->
  <!--
  <div class="band band-proto" data-design="b">
    <h2>Design B</h2>
  </div>

  <section data-design="b" data-kind="podcast">
    <div class="h2row"><h2>Podcast</h2></div>
    <div class="shell" data-nobreak><div id="w-podcast-hero"></div></div>
    <p class="status" id="s-podcast-hero"></p>
  </section>

  <section data-design="b" data-kind="live">
    <div class="h2row"><h2>Live radio</h2></div>
    <div class="shell" data-nobreak><div id="w-live-hero"></div></div>
    <p class="status" id="s-live-hero"></p>
  </section>
  -->

  <div class="band band-proto" data-design="c">
    <h2>Design C</h2>
  </div>

  <section data-design="c" data-kind="podcast">
    <div class="h2row"><h2>Podcast</h2></div>
    <div class="shell" data-nobreak><div id="w-podcast-c"></div></div>
    <p class="status" id="s-podcast-c"></p>
  </section>

  <section data-design="c" data-kind="live">
    <div class="h2row"><h2>Live radio</h2></div>
    <div class="shell" data-nobreak><div id="w-live-c"></div></div>
    <p class="status" id="s-live-c"></p>
  </section>

  <!-- The three Design D content types, frames 2669:136836, 2669:137076 and
       2669:136837. Ordered to sit opposite their shipping counterparts.
       Artist radio and playlist do not play. Their audio needs an authenticated
       profile and the only unauthenticated route mints an account on iHeart
       production per visit, which a public page should not do. The transport is
       simulated and everything else on them is real. -->
  <section data-design="c" data-kind="episode">
    <div class="h2row"><h2>Podcast episode</h2></div>
    <div class="shell" data-nobreak><div id="w-episode-c"></div></div>
    <p class="status" id="s-episode-c"></p>
  </section>

  <section data-design="c" data-kind="artist">
    <div class="h2row"><h2>Artist radio</h2></div>
    <div class="shell" data-nobreak><div id="w-artist-c"></div></div>
    <p class="status" id="s-artist-c"></p>
  </section>

  <section data-design="c" data-kind="playlist">
    <div class="h2row"><h2>Playlist</h2></div>
    <div class="shell" data-nobreak><div id="w-playlist-c"></div></div>
    <p class="status" id="s-playlist-c"></p>
  </section>
</main>

<script>
/* One column or two. The layout is entirely CSS; this only flips the attribute
   and tells the width control to re-measure, because a card's available width
   halves when the designs go side by side. */
(function () {
  const main = document.querySelector('main');
  /* The background and waveform listeners go with their controls. They are
     commented out rather than guarded on a null, because a guard would quietly
     hide the fact that the markup is missing; this way the pairing is visible
     and uncommenting the two header blocks without these does nothing, which is
     an obvious symptom rather than a silent one.

  const bseg = document.getElementById('bggrey').parentElement;
  bseg.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-bg]'); if (!b) return;
    [...bseg.children].forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    document.body.dataset.bg = b.dataset.bg;
  });

  const wseg = document.getElementById('wavetog').parentElement;
  wseg.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-wave]'); if (!b) return;
    [...wseg.children].forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    main.dataset.wave = b.dataset.wave;
  });
  */

  /* Anchored on its own button, not on '.colctl .seg'. There are two of those
     rows now and that selector quietly started returning the waveform one, so
     the columns toggle stopped doing anything at all. */
  const seg = document.getElementById('cols1').parentElement;
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-cols]'); if (!b) return;
    [...seg.children].forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    main.dataset.cols = b.dataset.cols;
    /* Defined in widget-core.js, which loads after this, so it is called on the
       next frame rather than now. */
    requestAnimationFrame(() => {
      if (typeof syncWidthControl === 'function') syncWidthControl();
    });
  });

  /* Height. The control sets exactly two things, the custom property and the
     flag on <main>, because container-type cannot be made conditional on a
     custom property's value and the CSS needs something it can select on.
     Auto removes both rather than setting a large number, so Auto is genuinely
     the old behaviour and not a tall slot pretending to be it.
     Design C is the only design that reads them. Design B is deliberately left
     frozen at 444, so above 440 the comparison is a card that grows beside one
     that does not, which is worth knowing when reading the results. */
  /* The pause overlay switch. Anchored on its own button, not on '.colctl .seg',
     which returned the wrong row once there were several of these and silently
     wired the columns toggle to the waveform one. */
  const vseg = document.getElementById('veiltog').parentElement;
  vseg.addEventListener('click', (e) => {
    const bt = e.target.closest('button[data-veil]'); if (!bt) return;
    [...vseg.children].forEach((x) => x.setAttribute('aria-pressed', String(x === bt)));
    main.dataset.veil = bt.dataset.veil;
  });
  main.dataset.veil = 'off';

  const hRange = document.getElementById('heightRange');
  const hNum = document.getElementById('heightNum');
  const hAuto = document.getElementById('heightAuto');
  const H_MIN = 100, H_MAX = 900;

  /* The compression rules key off the SHELL, so the shells have to be marked.
     Design C only: it is the one design that fills the height it is given. */
  const markFill = (on) => document.querySelectorAll('section[data-design="c"] .shell')
    .forEach((sh) => { if (on) sh.dataset.fill = ''; else delete sh.dataset.fill; });

  const applyHeight = (px) => {
    document.documentElement.style.setProperty('--player-h', px + 'px');
    main.dataset.h = 'on';
    markFill(true);
    hRange.value = String(px);
    /* Leave the field alone while it is being typed in, or the caret jumps.
       Same reason as the width control's own guard. */
    if (document.activeElement !== hNum) hNum.value = String(px);
    hAuto.setAttribute('aria-pressed', 'false');
  };

  const autoHeight = () => {
    document.documentElement.style.removeProperty('--player-h');
    delete main.dataset.h;
    markFill(false);
    hNum.value = '';
    hAuto.setAttribute('aria-pressed', 'true');
  };

  hRange.addEventListener('input', () => applyHeight(Number(hRange.value)));
  hAuto.addEventListener('click', autoHeight);

  const clampHeight = () => {
    const raw = Number(hNum.value);
    if (hNum.value.trim() === '' || !Number.isFinite(raw)) { autoHeight(); return; }
    applyHeight(Math.min(H_MAX, Math.max(H_MIN, Math.round(raw))));
  };
  hNum.addEventListener('input', () => {
    if (hNum.value.trim() === '') return;            /* mid-edit, leave it alone */
    const raw = Number(hNum.value);
    if (Number.isFinite(raw) && raw >= H_MIN && raw <= H_MAX) applyHeight(raw);
  });
  hNum.addEventListener('change', clampHeight);
  hNum.addEventListener('blur', clampHeight);
  hNum.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { clampHeight(); hNum.blur(); }
  });
  autoHeight();
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script src="widget-core.js?v=20260921220207"></script>
</body>
</html>
