<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Widget Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="widget-core.css?v=20260915193156">

<body>

<header>
  <div class="brand">Widget Prototype</div>
  <!-- The same cards in a real page's rail, for judging them in context rather
       than on a blank background. New tab, so playback and the width setting
       here survive the trip. -->
  <div class="hint"><a href="host-home.html" target="_blank" rel="noopener">See it in a publisher page</a></div>
  <div class="hint">Window <b class="vw" id="vw">0</b> px</div>
  <div class="widthctl">
    <label for="widthRange">Player width</label>
    <input id="widthRange" type="range" min="0" max="1320" step="1" aria-label="Player width">
    <input id="widthNum" type="number" min="0" max="1320" step="1" aria-label="Player width in pixels">
    <span class="unit">px</span>
    <button type="button" id="widthFill">Fill</button>
  </div>
  <div class="colctl">
    <label for="cols1">Columns</label>
    <span class="seg">
      <button type="button" id="cols1" data-cols="1" aria-pressed="true">1</button>
      <button type="button" id="cols2" data-cols="2" aria-pressed="false">2</button>
    </span>
  </div>
</header>

<main data-cols="1">
  <section class="full">
    <div class="h2row"><h2>Widget player</h2></div>
    <div class="embeds">
      <div class="embed">
        <span class="embed-label">Podcast</span>
        <iframe id="e-podcast" title="iHeart podcast embed, current production player"
                allow="autoplay" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <div class="embed">
        <span class="embed-label">Live radio</span>
        <iframe id="e-live" title="iHeart live radio embed, current production player"
                allow="autoplay" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
    <p class="status" id="s-embeds"></p>
  </section>

  <div class="band band-proto" data-design="a">
    <h2>Design A</h2>
  </div>

  <section data-design="a" data-kind="podcast">
    <div class="h2row"><h2>Podcast</h2><span class="gauge" id="g-podcast"></span></div>
    <div class="search" data-for="podcast">
      <input type="search" placeholder="Search podcasts, try Las Culturistas or Stuff You Should Know" aria-label="Search podcasts">
      <div class="results" hidden></div>
    </div>
    <div class="shell"><div id="w-podcast"></div></div>
    <p class="status" id="s-podcast"></p>
    <div class="colourline" id="c-podcast"></div>
  </section>

  <section data-design="a" data-kind="live">
    <div class="h2row"><h2>Live radio</h2><span class="gauge" id="g-live"></span></div>
    <div class="search" data-for="live">
      <input type="search" placeholder="Search stations, try Z100 or KFI" aria-label="Search stations">
      <div class="results" hidden></div>
    </div>
    <div class="shell"><div id="w-live"></div></div>
    <p class="status" id="s-live"></p>
    <div class="colourline" id="c-live"></div>
  </section>

  <!-- Design B is hidden for now. Commented out rather than deleted: the roster
       in widget-core.js builds itself from whichever roots exist in the page,
       so with these two gone no hero widget is created, nothing is loaded for
       it and no audio element is made. Put the block back to bring it back. -->
  <!--
  <div class="band band-proto">
    <h2>Design B</h2>
  </div>

  <section>
    <div class="h2row"><h2>Podcast</h2><span class="gauge" id="g-podcast-hero"></span></div>
    <div class="search" data-for="podcast-hero">
      <input type="search" placeholder="Search podcasts, try Las Culturistas or Stuff You Should Know" aria-label="Search podcasts">
      <div class="results" hidden></div>
    </div>
    <div class="shell" data-nobreak><div id="w-podcast-hero"></div></div>
    <p class="status" id="s-podcast-hero"></p>
    <div class="colourline" id="c-podcast-hero"></div>
  </section>

  <section>
    <div class="h2row"><h2>Live radio</h2><span class="gauge" id="g-live-hero"></span></div>
    <div class="search" data-for="live-hero">
      <input type="search" placeholder="Search stations, try Z100 or KFI" aria-label="Search stations">
      <div class="results" hidden></div>
    </div>
    <div class="shell" data-nobreak><div id="w-live-hero"></div></div>
    <p class="status" id="s-live-hero"></p>
    <div class="colourline" id="c-live-hero"></div>
  </section>

  -->

  <div class="band band-proto" data-design="c">
    <h2>Design C</h2>
  </div>

  <section data-design="c" data-kind="podcast">
    <div class="h2row"><h2>Podcast</h2><span class="gauge" id="g-podcast-c"></span></div>
    <div class="search" data-for="podcast-c">
      <input type="search" placeholder="Search podcasts, try Las Culturistas or Stuff You Should Know" aria-label="Search podcasts">
      <div class="results" hidden></div>
    </div>
    <div class="shell" data-nobreak><div id="w-podcast-c"></div></div>
    <p class="status" id="s-podcast-c"></p>
    <div class="colourline" id="c-podcast-c"></div>
  </section>

  <section data-design="c" data-kind="live">
    <div class="h2row"><h2>Live radio</h2><span class="gauge" id="g-live-c"></span></div>
    <div class="search" data-for="live-c">
      <input type="search" placeholder="Search stations, try Z100 or KFI" aria-label="Search stations">
      <div class="results" hidden></div>
    </div>
    <div class="shell" data-nobreak><div id="w-live-c"></div></div>
    <p class="status" id="s-live-c"></p>
    <div class="colourline" id="c-live-c"></div>
  </section>
</main>

<script>
/* One column or two. The layout is entirely CSS; this only flips the attribute
   and tells the width control to re-measure, because a card's available width
   halves when the designs go side by side. */
(function () {
  const main = document.querySelector('main');
  const seg = document.querySelector('.colctl .seg');
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-cols]'); if (!b) return;
    [...seg.children].forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    main.dataset.cols = b.dataset.cols;
    /* Defined in widget-core.js, which loads after this, so it is called on the
       next frame rather than now. */
    requestAnimationFrame(() => {
      if (typeof syncWidthControl === 'function') syncWidthControl();
    });
  });
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script src="widget-core.js?v=20260915193156"></script>
</body>
</html>
