<!-- accomplice's SkipForward, packages/accomplice/src/icons/skip-forward.tsx in
     iheartradio/web, path copied exactly at its own 24 viewBox so it matches
     back15.svg and fwd30.svg, which are drawn the same way.

     The previous file was a 40 viewBox carrying a third path, a superscript 6.
     iheart.com does not bake the skip count into the glyph: apps/listen's
     controls/next.tsx renders a plain <SkipForward> and lays the remaining
     count over it as a separate caption-3 Text, which is why a baked number
     could never tick down. -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="m7.58 16.89 5.77-4.07c.56-.4.56-1.24 0-1.63L7.58 7.11C6.91 6.65 6 7.12 6 7.93v8.14c0 .81.91 1.28 1.58.82ZM16 7v10c0 .55.45 1 1 1s1-.45 1-1V7c0-.55-.45-1-1-1s-1 .45-1 1Z" fill="white"/>
</svg>
