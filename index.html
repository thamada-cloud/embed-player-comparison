<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Embed Player Comparison</title>
<link rel="stylesheet" href="shared.css">
<style>
/* ---------- stage, one-at-a-time page only ---------- */
/* ---------- stage ---------- */
main {
  flex: 1;
  background: var(--stage);
  padding: 32px 20px 20px;
  display: flex; flex-direction: column; align-items: center;
}
/* ---------- footer nav ---------- */
footer {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 12px 20px; display: flex; align-items: center; gap: 14px;
  flex-wrap: wrap; position: sticky; bottom: 0;
}
.counter { font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; min-width: 74px; text-align: center; }
.spacer { margin-left: auto; }
.hint { font-size: 11.5px; color: var(--text-dim); }
.content-note { font-size: 12px; color: var(--text-dim); margin: 0 0 18px; text-align: center; max-width: 68ch; }
@media (max-width: 620px) {
  .brandmark { margin-right: 0; width: 100%; }
  main { padding: 18px 12px 12px; }
}
</style>
</head>
<body>

<header>
  <div class="brandmark">Embed Player Comparison <span id="modeDesc"></span></div>

  <div class="ctrl">
    <label>Scope</label>
    <div class="chips" id="groupSeg">
      <button data-group="parity" aria-pressed="true"><span class="tick">✓</span>Core <span class="n"></span></button>
      <button data-group="hosts" aria-pressed="false"><span class="tick">✓</span>Hosts <span class="n"></span></button>
      <button data-group="other" aria-pressed="false"><span class="tick">✓</span>Other <span class="n"></span></button>
      <button data-group="infra" aria-pressed="false"><span class="tick">✓</span>Infra <span class="n"></span></button>
      <button data-group="blocked" aria-pressed="false"><span class="tick">✓</span>Blocked <span class="n"></span></button>
      <button id="allBtn" title="Turn on every group">All 50</button>
    </div>
  </div>

  <div class="ctrl">
    <label>Content</label>
    <div class="seg" id="modeSeg">
      <button data-mode="live" aria-pressed="false">Live Radio</button>
      <button data-mode="podcast" aria-pressed="true">Podcast</button>
    </div>
  </div>

  <div class="ctrl">
    <label>Width</label>
    <div class="seg" id="widthSeg">
      <button data-w="375" aria-pressed="false">Phone</button>
      <button data-w="600" aria-pressed="false">Tablet</button>
      <button data-w="900" aria-pressed="true">Full</button>
    </div>
  </div>

  <div class="ctrl">
    <label>Theme</label>
    <div class="seg" id="themeSeg">
      <button data-theme="light" aria-pressed="true">Light</button>
      <button data-theme="dark" aria-pressed="false">Dark</button>
    </div>
  </div>
</header>

<main>
  <p class="content-note" id="contentNote"></p>
  <div class="card" id="card"></div>
</main>

<footer>
  <button class="btn" id="prev">&larr; Previous</button>
  <span class="counter" id="counter"></span>
  <button class="btn primary" id="next">Next &rarr;</button>
  <select class="jump" id="jump" aria-label="Jump to player"></select>
  <span class="spacer"></span>
  <a class="btn" href="gallery.html" style="text-decoration:none">View all on one page &rarr;</a>
  <button class="btn" id="shuffle" title="Randomize order to counterbalance across participants">Shuffle order</button>
  <span class="hint">Arrow keys navigate</span>
</footer>

<script src="players.js"></script>
<script>
/* The 50-player registry and the shared helpers live in players.js,
   loaded above, so this page and gallery.html cannot drift apart. */

/* ============================================================================
   VIEWER
   ==========================================================================*/

const state = {
  mode: 'podcast',
  width: 900,
  theme: 'light',
  i: 0,
  groups: new Set(['parity']),
  order: PLAYERS.map((_, n) => n)   /* indices into PLAYERS, shuffleable */
};

/* The visible roster is the shuffled order filtered to the active groups, so
   a real session is 7 cards and an internal review can be all of them. */
function visible() {
  return state.order.filter((pi) => state.groups.has(PLAYERS[pi].group));
}

const $ = (s) => document.querySelector(s);
const card = $('#card');

function current() { const v = visible(); return PLAYERS[v[state.i]]; }

/* Resolve which mode entry a player actually shows, and whether it fell back. */
const resolve = (p, mode) => resolveEntry(p, mode);
const srcFor  = (p, entry) => buildSrc(p, entry, state.theme);
const esc     = (s) => escHtml(s);

function render() {
  const p = current();
  const r = resolve(p, state.mode);

  card.style.maxWidth = state.width + 'px';

  /* Unmounting the old iframe rather than hiding it is the only reliable way
     to stop cross-origin audio. Two players talking at once ruins a session. */
  card.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'card-head';
  const groupChip = p.group === 'other'
    ? '<span class="chip sub">Different content</span>'
    : (p.group === 'parity' ? '<span class="chip sub">Same content</span>' : '');
  head.innerHTML =
    '<h2>' + esc(p.name) + '</h2>' +
    '<span class="chip ' + p.status + '">' + p.status + '</span>' +
    groupChip;
  card.appendChild(head);

  if (r.blocked) {
    const body = document.createElement('div');
    body.className = 'blocked-body';
    body.innerHTML =
      '<p class="why">Cannot be embedded. ' + esc(p.why || '') + '</p>' +
      '<p>' + esc(p.detail || '') + '</p>';
    card.appendChild(body);
  } else {
    const entry = r.entry;

    if (r.fellBack) {
      /* Word this by the direction of the fallback. Live-only players such as
         Zeno.fm, Apple Music and Twitch fall back the other way, and telling a
         moderator the opposite of the truth mid-session is worse than silence. */
      const bar = document.createElement('div');
      bar.className = 'fallback-bar';
      bar.textContent = r.to === 'podcast'
        ? 'No live radio on this platform. Showing its podcast player instead.'
        : 'No podcast on this platform. Showing its live radio player instead.';
      card.appendChild(bar);
    }
    if (entry.caveat) {
      const bar = document.createElement('div');
      bar.className = 'fallback-bar';
      bar.textContent = entry.caveat;
      card.appendChild(bar);
    }

    const wrap = document.createElement('div');
    wrap.className = 'frame-wrap' + (entry.aspect ? ' aspect' : '');
    const f = document.createElement('iframe');
    f.src = srcFor(p, entry);
    f.title = p.name + ' embed player';
    f.loading = 'eager';
    f.setAttribute('frameborder', '0');
    if (p.allow) f.setAttribute('allow', p.allow);
    if (p.allowfullscreen) f.setAttribute('allowfullscreen', '');
    if (p.sandbox) f.setAttribute('sandbox', p.sandbox);
    if (p.scrolling) f.setAttribute('scrolling', p.scrolling);
    if (!entry.aspect) f.height = entry.h;
    wrap.appendChild(f);
    card.appendChild(wrap);
  }

  /* Moderator notes, collapsed so the participant does not read the caveats
     before forming an opinion. Skipped when there is nothing to show, so a
     blocked card does not open onto an empty panel. */
  const facts = p.facts || {};
  const rows = Object.keys(facts).map((k) =>
    '<dt>' + esc(k) + '</dt><dd>' + esc(facts[k]) + '</dd>').join('');
  const srcLine = r.blocked ? '' :
    '<dt>Embed URL</dt><dd><code>' + esc(srcFor(p, r.entry)) + '</code></dd>';
  const groupLine = GROUPS[p.group]
    ? '<dt>Scope group</dt><dd>' + esc(GROUPS[p.group].label + '. ' + GROUPS[p.group].note) + '</dd>'
    : '';
  if (rows || srcLine || groupLine) {
    const notes = document.createElement('details');
    notes.className = 'notes';
    notes.innerHTML =
      '<summary>Moderator notes</summary>' +
      '<div class="notes-body"><dl>' + rows + srcLine + groupLine + '</dl></div>';
    card.appendChild(notes);
  }

  /* chrome */
  const n = visible().length;
  $('#counter').textContent = (state.i + 1) + ' of ' + n;
  $('#prev').disabled = state.i === 0;
  $('#next').disabled = state.i >= n - 1;
  $('#jump').value = String(state.i);
  const contentLine = state.mode === 'live'
    ? 'Live radio, ' + LIVE_LABEL
    : 'Podcast, ' + PODCAST_LABEL;
  const scopeLine = [...state.groups].filter((g) => GROUPS[g])
    .map((g) => GROUPS[g].label).join(' + ');
  $('#contentNote').innerHTML =
    esc(contentLine) + '<br><span style="opacity:.75">Showing ' + n + ' of ' +
    PLAYERS.length + ' players. Scope: ' + esc(scopeLine || 'nothing selected') + '</span>';
  $('#modeDesc').textContent = state.mode === 'live' ? 'live radio' : 'podcast';
}

function buildJump() {
  /* Grouped by scope, so it is obvious which groups are switched on and that
     more players exist behind the ones that are off. */
  const v = visible();
  const order = ['parity', 'hosts', 'other', 'infra', 'blocked'];
  let html = '';
  order.forEach((g) => {
    const items = v.map((pi, n) => ({ p: PLAYERS[pi], n })).filter((x) => x.p.group === g);
    if (!items.length) return;
    html += '<optgroup label="' + esc(GROUPS[g].label) + ' (' + items.length + ')">';
    html += items.map((x) => {
      const mark = x.p.status === 'blocked' ? ' · blocked'
                 : (x.p.status === 'caveat' ? ' · caveat' : '');
      return '<option value="' + x.n + '">' + esc(x.p.name) + mark + '</option>';
    }).join('');
    html += '</optgroup>';
  });
  $('#jump').innerHTML = html;
}

function go(n) {
  state.i = Math.max(0, Math.min(visible().length - 1, n));
  render();
}

function setPressed(container, attr, value) {
  container.querySelectorAll('button').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset[attr] === String(value)));
  });
}

/* ---- wiring ---- */
$('#modeSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.mode = b.dataset.mode;
  setPressed($('#modeSeg'), 'mode', state.mode);
  render();
});
$('#widthSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.width = Number(b.dataset.w);
  setPressed($('#widthSeg'), 'w', state.width);
  render();
});
$('#themeSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.theme = b.dataset.theme;
  document.documentElement.setAttribute('data-theme', state.theme);
  setPressed($('#themeSeg'), 'theme', state.theme);
  render();
});
$('#prev').addEventListener('click', () => go(state.i - 1));
$('#next').addEventListener('click', () => go(state.i + 1));
$('#jump').addEventListener('change', (e) => go(Number(e.target.value)));
$('#shuffle').addEventListener('click', () => {
  for (let i = state.order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
  }
  state.i = 0;
  buildJump();
  render();
});

/* Scope toggles are multi-select. Refusing to empty the last group avoids an
   empty stage the moderator has to debug mid-session. */
$('#groupSeg').addEventListener('click', (e) => {
  /* Must match ONLY the group chips. The All button is inside this container,
     and a bare closest('button') also caught it, adding an undefined group to
     the set and throwing in render(). */
  const b = e.target.closest('button[data-group]'); if (!b) return;
  const g = b.dataset.group;
  if (state.groups.has(g)) {
    if (state.groups.size === 1) return;
    state.groups.delete(g);
  } else {
    state.groups.add(g);
  }
  b.setAttribute('aria-pressed', String(state.groups.has(g)));
  state.i = 0;
  buildJump();
  render();
});

$('#allBtn').addEventListener('click', () => {
  Object.keys(GROUPS).forEach((g) => state.groups.add(g));
  document.querySelectorAll('#groupSeg button[data-group]').forEach((b) => {
    b.setAttribute('aria-pressed', 'true');
  });
  state.i = 0;
  buildJump();
  render();
});

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); go(state.i + 1); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); go(state.i - 1); }
});

/* Stamp each scope chip with how many players it holds. Without this the page
   looks like it only has 7 players and the rest are undiscoverable. */
(function stampCounts() {
  const tally = {};
  PLAYERS.forEach((p) => { tally[p.group] = (tally[p.group] || 0) + 1; });
  document.querySelectorAll('#groupSeg button[data-group]').forEach((b) => {
    b.querySelector('.n').textContent = tally[b.dataset.group] || 0;
  });
  const all = document.getElementById('allBtn');
  all.textContent = 'All ' + PLAYERS.length;
})();

document.documentElement.setAttribute('data-theme', state.theme);
buildJump();
render();
</script>
</body>
</html>
