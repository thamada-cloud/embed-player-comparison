<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Embed Player Comparison</title>
<link rel="stylesheet" href="shared.css">
<style>
/* ---------- stage, one-at-a-time page only ---------- */
/* ---------- stage ---------- */
main {
  flex: 1;
  background: var(--stage);
  padding: 32px 20px 20px;
  display: flex; flex-direction: column; align-items: center;
}
/* ---------- footer nav ---------- */
footer {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 12px 20px; display: flex; align-items: center; gap: 14px;
  flex-wrap: wrap; position: sticky; bottom: 0;
}
.counter { font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; min-width: 74px; text-align: center; }
.spacer { margin-left: auto; }
.hint { font-size: 11.5px; color: var(--text-dim); }
.content-note { font-size: 12px; color: var(--text-dim); margin: 0 0 18px; text-align: center; max-width: 68ch; }
@media (max-width: 620px) {
  .brandmark { margin-right: 0; width: 100%; }
  main { padding: 18px 12px 12px; }
}
</style>
</head>
<body>

<header>
  <div class="brandmark">Embed Player Comparison <span id="modeDesc"></span></div>

  <div class="ctrl">
    <label>Content</label>
    <div class="seg" id="modeSeg">
      <button data-mode="live" aria-pressed="false">Live Radio</button>
      <button data-mode="podcast" aria-pressed="true">Podcast</button>
    </div>
  </div>

  <div class="ctrl">
    <label>Width</label>
    <div class="seg" id="widthSeg">
      <button data-w="375" aria-pressed="false">Phone</button>
      <button data-w="600" aria-pressed="false">Tablet</button>
      <button data-w="900" aria-pressed="true">Full</button>
    </div>
  </div>

  <div class="ctrl">
    <label>Theme</label>
    <div class="seg" id="themeSeg">
      <button data-theme="light" aria-pressed="true">Light</button>
      <button data-theme="dark" aria-pressed="false">Dark</button>
    </div>
  </div>
</header>

<main>
  <p class="content-note" id="contentNote"></p>
  <div class="card" id="card"></div>
</main>

<footer>
  <button class="btn" id="prev">&larr; Previous</button>
  <span class="counter" id="counter"></span>
  <button class="btn primary" id="next">Next &rarr;</button>
  <select class="jump" id="jump" aria-label="Jump to player"></select>
  <span class="spacer"></span>
  <a class="btn" href="gallery.html" style="text-decoration:none">View all on one page &rarr;</a>
  <a class="btn" href="analysis.html" style="text-decoration:none">Analysis &rarr;</a>
  <button class="btn" id="shuffle" title="Randomize order to counterbalance across participants">Shuffle order</button>
  <span class="hint">Arrow keys navigate</span>
</footer>

<script src="players.js"></script>
<script>
/* The 50-player registry and the shared helpers live in players.js,
   loaded above, so this page and gallery.html cannot drift apart. */

/* ============================================================================
   VIEWER
   ==========================================================================*/

const state = {
  mode: 'podcast',
  width: 900,
  theme: 'light',
  i: 0,
  order: PLAYERS.map((_, n) => n)   /* indices into PLAYERS, shuffleable */
};

/* Every player, in the current shuffle order. No filtering. */
function visible() {
  return state.order;
}

const $ = (s) => document.querySelector(s);
const card = $('#card');

function current() { const v = visible(); return PLAYERS[v[state.i]]; }

/* Resolve which mode entry a player actually shows, and whether it fell back. */
const resolve = (p, mode) => resolveEntry(p, mode);
const srcFor  = (p, entry) => buildSrc(p, entry, state.theme);
const esc     = (s) => escHtml(s);

function render() {
  const p = current();
  const r = resolve(p, state.mode);

  card.style.maxWidth = state.width + 'px';

  /* Unmounting the old iframe rather than hiding it is the only reliable way
     to stop cross-origin audio. Two players talking at once ruins a session. */
  card.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'card-head';
  const groupChip = p.group === 'other'
    ? '<span class="chip sub">Different content</span>'
    : (p.group === 'parity' ? '<span class="chip sub">Same content</span>' : '');
  head.innerHTML =
    '<h2>' + esc(p.name) + '</h2>' +
    '<span class="chip ' + p.status + '">' + p.status + '</span>' +
    groupChip;
  card.appendChild(head);

  if (r.blocked) {
    const body = document.createElement('div');
    body.className = 'blocked-body';
    body.innerHTML =
      '<p class="why">Cannot be embedded. ' + esc(p.why || '') + '</p>' +
      '<p>' + esc(p.detail || '') + '</p>';
    card.appendChild(body);
  } else {
    const entry = r.entry;

    if (r.fellBack) {
      const bar = document.createElement('div');
      bar.className = 'fallback-bar';
      bar.textContent = fallbackText(r.to);   /* worded by direction, see players.js */
      card.appendChild(bar);
    }
    if (entry.caveat) {
      const bar = document.createElement('div');
      bar.className = 'fallback-bar';
      bar.textContent = entry.caveat;
      card.appendChild(bar);
    }

    const wrap = document.createElement('div');
    wrap.className = 'frame-wrap' + (entry.aspect ? ' aspect' : '');
    const f = document.createElement('iframe');
    f.src = srcFor(p, entry);
    f.title = p.name + ' embed player';
    f.loading = 'eager';
    f.setAttribute('frameborder', '0');
    if (p.allow) f.setAttribute('allow', p.allow);
    if (p.allowfullscreen) f.setAttribute('allowfullscreen', '');
    if (p.sandbox) f.setAttribute('sandbox', p.sandbox);
    if (p.scrolling) f.setAttribute('scrolling', p.scrolling);
    if (!entry.aspect) f.height = entry.h;
    wrap.appendChild(f);
    card.appendChild(wrap);
  }

  /* Moderator notes, collapsed so the participant does not read the caveats
     before forming an opinion. Skipped when there is nothing to show, so a
     blocked card does not open onto an empty panel. */
  const facts = p.facts || {};
  const rows = Object.keys(facts).map((k) =>
    '<dt>' + esc(k) + '</dt><dd>' + esc(facts[k]) + '</dd>').join('');
  const srcLine = r.blocked ? '' :
    '<dt>Embed URL</dt><dd><code>' + esc(srcFor(p, r.entry)) + '</code></dd>';
  const groupLine = GROUPS[p.group]
    ? '<dt>Scope group</dt><dd>' + esc(GROUPS[p.group].label + '. ' + GROUPS[p.group].note) + '</dd>'
    : '';
  if (rows || srcLine || groupLine) {
    const notes = document.createElement('details');
    notes.className = 'notes';
    notes.innerHTML =
      '<summary>Moderator notes</summary>' +
      '<div class="notes-body"><dl>' + rows + srcLine + groupLine + '</dl></div>';
    card.appendChild(notes);
  }

  /* chrome */
  const n = visible().length;
  $('#counter').textContent = (state.i + 1) + ' of ' + n;
  $('#prev').disabled = state.i === 0;
  $('#next').disabled = state.i >= n - 1;
  $('#jump').value = String(state.i);
  const contentLine = state.mode === 'live'
    ? 'Live radio, ' + LIVE_LABEL
    : 'Podcast, ' + PODCAST_LABEL;
  $('#contentNote').textContent = contentLine;
  $('#modeDesc').textContent = state.mode === 'live' ? 'live radio' : 'podcast';
}

function buildJump() {
  /* Flat, in registry order, matching the gallery. */
  $('#jump').innerHTML = visible().map((pi, n) => {
    const p = PLAYERS[pi];
    const mark = p.status === 'blocked' ? ' \u00b7 blocked'
               : (p.status === 'caveat' ? ' \u00b7 caveat' : '');
    return '<option value="' + n + '">' + esc(p.name) + mark + '</option>';
  }).join('');
}

function go(n) {
  state.i = Math.max(0, Math.min(visible().length - 1, n));
  render();
}

function setPressed(container, attr, value) {
  container.querySelectorAll('button').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset[attr] === String(value)));
  });
}

/* ---- wiring ---- */
$('#modeSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.mode = b.dataset.mode;
  setPressed($('#modeSeg'), 'mode', state.mode);
  render();
});
$('#widthSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.width = Number(b.dataset.w);
  setPressed($('#widthSeg'), 'w', state.width);
  render();
});
$('#themeSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.theme = b.dataset.theme;
  document.documentElement.setAttribute('data-theme', state.theme);
  setPressed($('#themeSeg'), 'theme', state.theme);
  render();
});
$('#prev').addEventListener('click', () => go(state.i - 1));
$('#next').addEventListener('click', () => go(state.i + 1));
$('#jump').addEventListener('change', (e) => go(Number(e.target.value)));
$('#shuffle').addEventListener('click', () => {
  for (let i = state.order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
  }
  state.i = 0;
  buildJump();
  render();
});

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); go(state.i + 1); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); go(state.i - 1); }
});

document.documentElement.setAttribute('data-theme', state.theme);
buildJump();
render();
</script>
</body>
</html>
